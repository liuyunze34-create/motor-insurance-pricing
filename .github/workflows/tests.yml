name: tests

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "dashboard.html"
      - "outputs/**"
      - "figures/**"
      - "models/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "dashboard.html"
      - "outputs/**"
      - "figures/**"
      - "models/**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python download_data.py
      - run: pytest -q
